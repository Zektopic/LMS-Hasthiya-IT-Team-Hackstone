name: Release on Push to Main

on:
  push:
    branches:
      - main
  workflow_dispatch:

# Declare default permissions as read only.
permissions: read-all

jobs:
  # ── 1. Extract version from pubspec.yaml ──────────────────────────────────
  get-version:
    name: Get version from pubspec.yaml
    runs-on: [self-hosted, manupa-hnx]
    outputs:
      version: ${{ steps.extract.outputs.version }}
    steps:
      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - name: Extract version
        id: extract
        run: |
          VERSION=$(grep '^version:' pubspec.yaml | sed 's/version: //' | tr -d '[:space:]')
          echo "version=v${VERSION}" >> "$GITHUB_OUTPUT"

  # ── 2. Build Android APK ──────────────────────────────────────────────────
  build-android:
    name: Build Android APK
    runs-on: [self-hosted, manupa-hnx]
    needs: get-version
    steps:
      - name: Set up JDK 17
        uses: actions/setup-java@de7274f081f381c8f8158605e0321c36c376e2e6
        with:
          java-version: "17"
          distribution: temurin

      - name: Clone Flutter repository with stable channel
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - run: flutter pub get
      - run: flutter build apk --release

      - name: Upload APK artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-apk
          path: build/app/outputs/flutter-apk/app-release.apk

  # ── 3. Build Web ──────────────────────────────────────────────────────────
  build-web:
    name: Build Web
    runs-on: [self-hosted, manupa-hnx]
    needs: get-version
    steps:
      - name: Clone Flutter repository with stable channel
        uses: subosito/flutter-action@v2
        with:
          flutter-version: "3.19.6"
          channel: stable

      - name: Checkout code
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1
      - name: Configure Git safe directory
        run: git config --global --add safe.directory '*'

      - run: flutter pub get
      - run: flutter build web --release

      - name: Compress web build
        run: tar czf web-release.tar.gz -C build/web .

      - name: Upload web artifact
        uses: actions/upload-artifact@v7.0.1
        with:
          name: release-web
          path: web-release.tar.gz

  # ── 4. Create GitHub Release and upload assets ───────────────────────────
  create-release:
    name: Create GitHub Release
    runs-on: [self-hosted, manupa-hnx]
    needs: [get-version, build-android, build-web]
    permissions:
      contents: write
    steps:
      - name: Download APK artifact
        uses: actions/download-artifact@v8
        with:
          name: release-apk
          path: artifacts/android

      - name: Download web artifact
        uses: actions/download-artifact@v8
        with:
          name: release-web
          path: artifacts/web

      - name: Create release and upload assets
        uses: softprops/action-gh-release@efb35369e0ad2afab669f228072c1b0d510eae64
        with:
          tag_name: ${{ needs.get-version.outputs.version }}
          name: Release ${{ needs.get-version.outputs.version }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            artifacts/android/app-release.apk
            artifacts/web/web-release.tar.gz
